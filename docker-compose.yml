services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: fin-faculty-bot:latest
    container_name: fin-faculty-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/fin_faculty_bot.db}
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
    name: fin-faculty-bot-data
